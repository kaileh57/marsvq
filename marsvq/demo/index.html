const ROOT = "../../";
const BAND = 28;  // dark strip above and below the image for the text
const img = document.getElementById("img");
const cv = document.getElementById("cv");
const line = document.getElementById("line");
const ctx = cv.getContext("2d");

let i = 0;
let showEdit = false;
const editOk = {};  // stem -> true/false once probed

function editSrc(p) { return ROOT + "data/pairs/" + p.stem + "/edit.jpg"; }

function probeEdit(p) {
  if (p.stem in editOk) return;
  const t = new Image();
  t.onload = () => { editOk[p.stem] = true; if (PAIRS[i] === p) show(); };
  t.onerror = () => { editOk[p.stem] = false; if (PAIRS[i] === p) show(); };
  t.src = editSrc(p);
}

function show() {
  const p = PAIRS[i];
  probeEdit(p);
  const useEdit = showEdit && editOk[p.stem] === true;
  const src = useEdit ? editSrc(p) : ROOT + p.jpeg;
  let label = !showEdit ? "source" : useEdit ? "edit" : "edit pending";
  line.textContent = p.stem + "  " + label;
  if (img.getAttribute("src") !== src) img.src = src;
  else layout();
}

function layout() {
  const p = PAIRS[i];
  const nw = img.naturalWidth, nh = img.naturalHeight;
  if (!nw || !nh) return;
  const vw = window.innerWidth, vh = window.innerHeight - 2 * BAND;
  const s = Math.min(vw / nw, vh / nh);
  const w = Math.round(nw * s), h = Math.round(nh * s);
  const x = Math.round((vw - w) / 2), y = BAND + Math.round((vh - h) / 2);
  for (const el of [img, cv]) {
    el.style.left = x + "px"; el.style.top = y + "px";
    el.style.width = w + "px"; el.style.height = h + "px";
  }
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  // Path pixels are in source-image coordinates; map by the source size.
  const [sw, sh] = p.image_size;
  const pts = p.points;
  if (pts.length < 2) return;
  ctx.beginPath();
  pts.forEach(([px, py], k) => {
    const X = px / sw * w, Y = py / sh * h;
    k ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
  });
  ctx.strokeStyle = "#39e639";
  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.stroke();
}

img.addEventListener("load", layout);
window.addEventListener("resize", layout);

});
